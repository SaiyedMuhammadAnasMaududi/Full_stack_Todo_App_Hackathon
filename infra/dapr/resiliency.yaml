apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: todo-resiliency
  namespace: todo-app
spec:
  policies:
    retries:
      pubsubRetry:
        policy: exponential
        maxInterval: 10s
        maxRetries: 3
      serviceRetry:
        policy: constant
        duration: 2s
        maxRetries: 3
    circuitBreakers:
      pubsubCB:
        maxRequests: 1
        interval: 30s
        timeout: 30s
        trip: consecutiveFailures > 5
  targets:
    components:
      pubsub-kafka:
        outbound:
          retry: pubsubRetry
          circuitBreaker: pubsubCB
    apps:
      todo-backend:
        retry: serviceRetry
