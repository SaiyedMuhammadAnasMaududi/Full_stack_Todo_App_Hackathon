name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: syedanasbhai/todo_backend
  FRONTEND_IMAGE: syedanasbhai/todo_frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install backend linter
        run: pip install ruff

      - name: Lint backend
        run: ruff check backend/ --ignore E501

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Lint frontend
        run: |
          cd frontend
          npm ci
          npm run lint || true

  build-and-push:
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy backend
        run: |
          helm upgrade --install backend charts/backend \
            --namespace todo-app \
            --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set secrets.database_url=${{ secrets.DATABASE_URL }} \
            --set secrets.cohere_api_key=${{ secrets.COHERE_API_KEY }} \
            --set secrets.better_auth_secret=${{ secrets.BETTER_AUTH_SECRET }}

      - name: Deploy frontend
        run: |
          helm upgrade --install frontend charts/frontend \
            --namespace todo-app \
            --set image.tag=${{ github.sha }} \
            --set env.NEXT_PUBLIC_BACKEND_URL=${{ secrets.BACKEND_URL }}

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/backend -n todo-app --timeout=120s
          kubectl rollout status deployment/frontend -n todo-app --timeout=120s

      - name: Rollback on failure
        if: failure()
        run: |
          helm rollback backend -n todo-app || true
          helm rollback frontend -n todo-app || true
